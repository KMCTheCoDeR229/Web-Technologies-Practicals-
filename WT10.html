
<!DOCTYPE html>
<html>
<head>
    <title>Show Hide Password</title>
</head>
<body>
    <h2>Login Form</h2>

    <form>
        Username:
        <input type="text" name="username">
        <br><br>

        Password:
        <input type="password" id="password">
        <br><br>

        <input type="checkbox" onclick="showPassword()">
        Show Password
    </form>

    <script>
        function showPassword() {
            let p = document.getElementById("password");

            if (p.type === "password") {
                p.type = "text";
            } else {
                p.type = "password";
            }
        }
    </script>
</body>
</html>
