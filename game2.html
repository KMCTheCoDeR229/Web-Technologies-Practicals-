
<!DOCTYPE html>
<html>
<head>
    <title>Whack a Mole Game</title>

    <style>
        /* Page design */
        body {
            background: linear-gradient(135deg, #c2ffd8, #465efb);
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #17324d;
            font-size: 35px;
        }

        .game {
            background-color: white;
            width: 90%;
            max-width: 450px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 5px 20px #0003;
        }

        /* Score and timer */
        .info {
            display: flex;
            justify-content: space-around;
            font-size: 20px;
            font-weight: bold;
            margin: 20px;
            color: #333;
        }

        /* Game board */
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 20px auto;
        }

        /* Mole holes */
        .hole {
            height: 95px;
            border: none;
            border-radius: 50%;
            background-color: #8b5a2b;
            box-shadow: inset 0 7px 10px #42230b;
            font-size: 48px;
            cursor: pointer;
            touch-action: manipulation;
        }

        .hole:hover {
            background-color: #75451f;
        }

        /* Start button */
        #start {
            background-color: #ff7043;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            cursor: pointer;
        }

        #start:hover {
            background-color: #e64a19;
        }

        #message {
            font-size: 18px;
            color: #333;
            font-weight: bold;
            min-height: 25px;
        }

        @media(max-width: 400px) {
            .hole {
                height: 75px;
                font-size: 38px;
            }
        }
    </style>
</head>

<body>

    <h1>🐹 Whack-a-Mole!</h1>

    <div class="game">

        <div class="info">
            <div>Score: <span id="score">0</span></div>
            <div>Time: <span id="time">30</span>s</div>
        </div>

        <p>Click the mole to earn points!</p>

        <!-- Game board -->
        <div class="board" id="board">

            <button class="hole"></button>
            <button class="hole"></button>
            <button class="hole"></button>

            <button class="hole"></button>
            <button class="hole"></button>
            <button class="hole"></button>

            <button class="hole"></button>
            <button class="hole"></button>
            <button class="hole"></button>

        </div>

        <button id="start" onclick="startGame()">
            Start Game
        </button>

        <p id="message">Ready? Let's Play!</p>

    </div>

    <script>

        // Get HTML elements
        let holes = document.querySelectorAll(".hole");

        let score = 0;
        let time = 30;
        let molePosition = -1;
        let gameRunning = false;

        let timer;
        let moleTimer;

        // Function to show mole
        function showMole() {

            // Remove mole from all holes
            holes.forEach(function(hole) {
                hole.innerHTML = "";
            });

            // Generate random hole number
            molePosition = Math.floor(Math.random() * 9);

            // Show mole in random hole
            holes[molePosition].innerHTML = "🐹";
        }

        // Check which hole is clicked
        holes.forEach(function(hole, index) {

            hole.addEventListener("click", function() {

                if (gameRunning && index == molePosition) {

                    // Increase score
                    score = score + 10;

                    // Update score on screen
                    document.getElementById("score").innerHTML = score;

                    // Move mole to another hole
                    showMole();
                }

            });

        });

        // Start game function
        function startGame() {

            // Clear old timers
            clearInterval(timer);
            clearInterval(moleTimer);

            // Reset values
            score = 0;
            time = 30;
            gameRunning = true;

            document.getElementById("score").innerHTML = score;
            document.getElementById("time").innerHTML = time;

            document.getElementById("message").innerHTML =
                "Catch the mole!";

            document.getElementById("start").disabled = true;

            // Show first mole
            showMole();

            // Change mole position every 700 milliseconds
            moleTimer = setInterval(showMole, 700);

            // Decrease time every second
            timer = setInterval(function() {

                time--;

                document.getElementById("time").innerHTML = time;

                // Check if time is over
                if (time <= 0) {

                    endGame();

                }

            }, 1000);

        }

        // End game function
        function endGame() {

            gameRunning = false;

            // Stop both timers
            clearInterval(timer);
            clearInterval(moleTimer);

            // Remove mole
            holes.forEach(function(hole) {
                hole.innerHTML = "";
            });

            molePosition = -1;

            // Display final score
            document.getElementById("message").innerHTML =
                "🎉 Game Over! Your Score: " + score;

            document.getElementById("start").disabled = false;

            document.getElementById("start").innerHTML =
                "Play Again";

        }

    </script>

</body>
</html>
